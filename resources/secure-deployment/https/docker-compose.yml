services:
  nginx-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro          
      - ./certs/selfsigned.key:/etc/ssl/private/nginx-selfsigned.key:ro
    networks:
      - dvwa-net

  dvwa:
    image: vulnerables/web-dvwa
    restart: always
    networks:
      - dvwa-net
      
networks:
  dvwa-net:
    driver: bridge